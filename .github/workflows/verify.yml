name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingress:
    name: HAProxy TLS and private Admin transport
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install HAProxy for the local TLS fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends haproxy
      - name: Verify routing, API balancing and certificate preservation
        run: python3 eng/test-haproxy.py

  repository:
    name: Repository-wide compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify repository and material coverage
        env:
          COLLECT_COVERAGE: "1"
        run: ./eng/verify.sh

      - name: Preserve coverage review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            artifacts/coverage/report/
            artifacts/coverage/material-review.txt
          if-no-files-found: error
          retention-days: 14

  hosts:
    name: Verify ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [core-api, admin-api, admin-bootstrap, db-migrator, web, workstation]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify and publish non-Workstation host graph
        if: matrix.host != 'workstation'
        run: ./eng/verify-host-ci.sh "${{ matrix.host }}"

      - name: Verify host and its owned test graph
        if: matrix.host == 'workstation'
        run: ./eng/verify-host.sh "${{ matrix.host }}"

      - name: Publish this host
        if: matrix.host == 'workstation'
        run: ./eng/build-host.sh "${{ matrix.host }}" --publish

      - name: Preserve non-Workstation host verification log
        if: always() && matrix.host != 'workstation'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.host }}-verification
          path: artifacts/host-verification/${{ matrix.host }}.log
          if-no-files-found: error
          retention-days: 14

      - name: Preserve independently built host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.host }}
          path: artifacts/publish/${{ matrix.host }}/
          if-no-files-found: error
          retention-days: 14

  architecture:
    name: Project boundary checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check verification scripts without builds
        run: python3 eng/test-quality-verification.py
      - name: Install repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify dependency boundaries
        run: |
          dotnet restore tests/architecture/Application.Architecture.Tests/Application.Architecture.Tests.csproj --locked-mode
          dotnet test tests/architecture/Application.Architecture.Tests/Application.Architecture.Tests.csproj --configuration Release --no-restore

  mutation:
    name: Challenge order commitment invariant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Run scoped mutation gate
        run: ./eng/mutate-orders.sh
      - name: Preserve mutation review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: order-commitment-mutation
          path: artifacts/mutation-orders/
          if-no-files-found: error
          retention-days: 14
