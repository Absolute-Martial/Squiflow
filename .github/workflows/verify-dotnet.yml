name: verify-dotnet

on:
  push:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "*.sln"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/verify-dotnet.yml"
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "*.sln"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/verify-dotnet.yml"

permissions:
  contents: read

jobs:
  verify-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore
        run: dotnet restore SquiFlow.sln

      - name: Build
        run: dotnet build SquiFlow.sln -c Release --no-restore

      - name: Test
        run: dotnet test SquiFlow.sln -c Release --no-build
