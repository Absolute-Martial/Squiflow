image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - verify
  - package

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  key: "nuget-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

build:
  stage: build
  script:
    - dotnet --info
    - dotnet restore SquiFlow.sln
    - dotnet build SquiFlow.sln -c Release --no-restore
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "**/bin/Release/"

verify:
  stage: verify
  needs: ["build"]
  script:
    - dotnet restore SquiFlow.sln
    - dotnet run --project tests/SquiFlow.ApplicationKernel.Specs/SquiFlow.ApplicationKernel.Specs.csproj -c Release --no-build
    - dotnet run --project tests/SquiFlow.Architecture.Specs/SquiFlow.Architecture.Specs.csproj -c Release --no-build
    - dotnet list SquiFlow.sln package --vulnerable --include-transitive
    - >-
      if git grep -nEI '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|password[[:space:]]*=[[:space:]]*[^$<{[:space:]]+|api[_-]?key[[:space:]]*=[[:space:]]*[^$<{[:space:]]+)' -- ':!docs/review/**' ':!*.md'; then
        echo 'Potential hard-coded secret detected'; exit 1;
      else
        echo 'No obvious hard-coded secret pattern detected';
      fi

package:
  stage: package
  needs: ["build", "verify"]
  script:
    - dotnet restore SquiFlow.sln
    - mkdir -p artifacts
    - dotnet publish apps/web/SquiFlow.Web/SquiFlow.Web.csproj -c Release --no-restore -o artifacts/web
    - dotnet publish services/core-api/SquiFlow.CoreApi/SquiFlow.CoreApi.csproj -c Release --no-restore -o artifacts/core-api
    - dotnet publish apps/desktop/workstation/SquiFlow.Workstation/SquiFlow.Workstation.csproj -c Release --no-restore -o artifacts/workstation
    - dotnet publish apps/desktop/guard/SquiFlow.Guard/SquiFlow.Guard.csproj -c Release --no-restore -o artifacts/guard
    - find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
  artifacts:
    expire_in: 14 days
    paths:
      - artifacts/
